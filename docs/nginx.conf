# The docs server's site config (mounted over nginx's default.conf). Docsify
# routes client-side, so unknown paths fall back to index.html; everything
# under / (ADR documents, the frozen OpenAPI JSON the Scalar page loads
# same-origin, this file included) is served read-only from the bind mount.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Traefik dynamic configuration (ADR 0001): the whole route table, watched
# live. API routes keep PathPrefix semantics unchanged so the backends see
# /api/v1/auth/* and /api/v3/quotes/* exactly as the SPA emits them. Dev
# surfaces (docs, pgweb, SPA) share the same host port via path prefixes;
# StripPrefix lets each backend keep serving from / internally.
http:
  middlewares:
    strip-docs:
      stripPrefix:
        prefixes:
          - /docs
    strip-pgweb:
      stripPrefix:
        prefixes:
          - /pgweb

  routers:
    auth:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/auth`)"
      priority: 100
      service: authapi
    quotes:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v3/quotes`)"
      priority: 100
      service: quotesapi
    docs:
      entryPoints: [web]
      rule: "PathPrefix(`/docs`)"
      priority: 50
      middlewares: [strip-docs]
      service: docs
    pgweb:
      entryPoints: [web]
      rule: "PathPrefix(`/pgweb`)"
      priority: 50
      middlewares: [strip-pgweb]
      service: pgweb
    spa:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 10
      service: frontend

  services:
    authapi:
      loadBalancer:
        servers:
          - url: "http://authapi:8080"
    quotesapi:
      loadBalancer:
        servers:
          - url: "http://quotesapi:8080"
    docs:
      loadBalancer:
        servers:
          - url: "http://docs:80"
    pgweb:
      loadBalancer:
        servers:
          - url: "http://pgweb:8081"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:5173"
